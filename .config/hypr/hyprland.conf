exec-once = ~/.config/hypr/scripts/xdg-portal-hyprland
exec-once = ~/.config/hypr/scripts/pipewire.sh

# Source other files
source=~/.config/hypr/variables/keybinds.conf
source=~/.config/hypr/variables/programs.conf
source=~/.config/hypr/variables/keybinds.conf

source=~/.config/hypr/environments/environments.conf

source=~/.config/hypr/monitors/monitors.conf

source=~/.config/hypr/layouts/default.conf

source=~/.cache/wal/colors-hyprland.conf

source=~/.config/hypr/windowrules/windowrules.conf

source=~/.config/hypr/keybindings/keybindings.conf

source=~/.config/hypr/presets/default.conf

# exec-once=dunst
exec-once=swww-daemon
exec-once=openrazer-daemon -r
exec-once=~/.config/hypr/scripts/wallpaper.sh
# exec-once=waybar


input {
  kb_layout = gb
  numlock_by_default = true
  repeat_rate = 25
  repeat_delay = 600 
  sensitivity = 0
  follow_mouse = 1
  mouse_refocus = true
  # kb_options = caps:backspace# , ctrl:swap_lalt_lctl
}

cursor {
  no_warps = false
  persistent_warps = false
  default_monitor = DP-3
}

misc {
  animate_manual_resizes = true
  disable_hyprland_logo = true
  disable_hyprland_qtutils_check = true
  enable_anr_dialog = false
  middle_click_paste = false
}

env = HYPRCURSOR_THEME, NotwaitaBlack
env = HYPRCURSOR_SIZE, 24
